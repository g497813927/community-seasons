# Example virtual host. Set server_name and root for your server.
# Install in your Nginx http configuration (for example, conf.d/community-seasons.conf).
server {
    listen 80;
    server_name game.example.com;
    root /var/www/community-seasons;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
