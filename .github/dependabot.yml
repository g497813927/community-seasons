version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/src"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    versioning-strategy: "increase"
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 drops the compiler JS API that the test harness uses; migrate before allowing 7.x.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      # Group each dependency across directories without mixing unrelated updates.
      per-dependency:
        applies-to: "version-updates"
        group-by: "dependency-name"
        patterns:
          - "*"
  - package-ecosystem: "npm"
    # Archived QA fixture already runs TypeScript 7 and has no compiler-API tests.
    directory: "/tests/qa/archive/phone-cart-fix-qa"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    versioning-strategy: "increase"
    open-pull-requests-limit: 5
    groups:
      per-dependency:
        applies-to: "version-updates"
        group-by: "dependency-name"
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
