version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/src"
      - "/qa/archive/phone-cart-fix-qa"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    versioning-strategy: "increase"
    open-pull-requests-limit: 5
    groups:
      # Group each dependency across directories without mixing unrelated updates.
      per-dependency:
        applies-to: "version-updates"
        group-by: "dependency-name"
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
