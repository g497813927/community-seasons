name: Build and QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-qa:
    name: Compile and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CI: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/package-lock.json

      - name: Install locked dependencies
        run: |
          mkdir -p results/ci
          npm run setup 2>&1 | tee results/ci/setup.log

      - name: Compile production and run regressions
        run: |
          npm run build 2>&1 | tee results/ci/production-build.log
          npm test 2>&1 | tee results/ci/regressions.log
          npm run test:types 2>&1 | tee results/ci/types.log

      - name: Run bounded fuzz tests
        run: node run.mjs quick --rounds 1 --seed 20260914 --no-tui 2>&1 | tee results/ci/fuzz.log

      - name: Compile and test the general QA framework
        run: |
          npm run qa:build 2>&1 | tee results/ci/qa-build.log
          npm run qa:test 2>&1 | tee results/ci/qa-tests.log

      - name: Compile and test archived phone harnesses
        run: |
          npm run qa:archive:phone:build 2>&1 | tee results/ci/archive-phone-build.log
          npm run qa:archive:iphone:build 2>&1 | tee results/ci/archive-iphone-build.log
          node --test qa/archive/phone-cart-fix-qa/cart-helper.test.mjs qa/archive/iphone-qa/probe.test.mjs qa/archive/iphone-qa/suite.test.mjs 2>&1 | tee results/ci/archive-phone-tests.log

      - name: Install browser engines and Linux dependencies
        run: npx --no-install playwright install --with-deps chromium webkit 2>&1 | tee results/ci/browser-install.log

      - name: Run Web, Android and iOS browser checks
        run: npm run qa:all 2>&1 | tee results/ci/browser-qa.log

      - name: Preserve failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-failure-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: false
          path: |
            results/
            !results/qa/device-*/**
            !results/qa/vercel-*/**
            qa/archive/**/*-result.json
            qa/archive/**/*results*.json
            qa/archive/**/*-failures-*/
            work/**/*-failures-*/
