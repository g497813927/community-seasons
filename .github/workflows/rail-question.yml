name: Check rail question

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: rail-question-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate question submission
    if: github.event.issue.state == 'open'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # The issues event uses the default branch's SHA, never contributor code.
      - name: Check out trusted checker and question bank
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.1

      - name: Validate submission and update feedback
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Issue content is read as JSON data, never interpolated into shell code.
        run: node scripts/check-rail-question.mjs --event "$GITHUB_EVENT_PATH"
